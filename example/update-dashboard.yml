name: Update Running Dashboard

on:
  workflow_dispatch:

  schedule:
    - cron: "17 5 * * *"
      timezone: "Europe/Amsterdam"

permissions:
  id-token: write
  contents: read

concurrency:
  group: running-dashboard-update
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      AZURE_PRIVATE_SYNC_ENABLED: "1"
      AZURE_PRIVATE_STORAGE_ACCOUNT: "runningdashboardprivate"
      AZURE_PRIVATE_CONTAINER: "pipeline-state"

      AZURE_PUBLISH_ENABLED: "1"
      AZURE_PUBLIC_STORAGE_ACCOUNT: "runningdashboardpublic"
      AZURE_PUBLIC_CONTAINER: "dashboard-data"

      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Garmin data and dashboard
        run: python running_dashboard_pipeline.py
